<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Word-match</title>
  <!-- Links -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  
  <link rel="stylesheet" href="./Stylesheets/langMatchFlex.css">
  <link rel="stylesheet" href="./Stylesheets/mobile.css" media="screen and (max-width: 450px)">
  <script type="module" src="./matchingGame.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap');
  </style>
</head>
<body>
  <div class="container-fluid p-0">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto pe-3 mx-auto" id="langList">
            <li class="nav-item">
              <button type="button" class="langOpt mx-5" id="norwegianButton">Norwegian</button>
            </li>
            <li class="nav-item">
              <button type="button" class="langOpt mx-5" id="chineseButton">Chinese</button>
            </li>
            <li class="nav-item">
              <button type="button" class="langOpt mx-5" id="italianButton">Italian</button>
            </li>
            <li class="nav-item">
              <button type="button" class="langOpt mx-5" id="germanButton">German</button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <header>
      <h1>Language Word-match</h1>
      <p>What does the word below mean?</p>
    </header>

    <div id="game">
      <div id="queryValueBox">
        <p>Query key goes here</p>
      </div>

      <div id="answerBox">
        <p></p>
      </div>

      <div id="buttons">
        <ul id="ansList">
          <li><button type="button" class="ansOpt" id="buttonOne">Button 1</button></li>
          <li><button type="button" class="ansOpt" id="buttonTwo">Button 2</button></li>
          <li><button type="button" class="ansOpt" id="buttonThree">Button 3</button></li>
          <li><button type="button" class="ansOpt" id="buttonFour">Button 4</button></li>
        </ul>
      </div>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
  </div>
</body>
</html>
